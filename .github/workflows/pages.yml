name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the landing page and the workshop slides, not build tools or server code.
      - name: Assemble site
        run: |
          mkdir -p _site/hackathon
          cp index.html .nojekyll _site/
          cp -r agentic-ai agentic-hardware _site/
          cp hackathon/index.html _site/hackathon/
          rsync -a --exclude '*.pptx' --exclude 'session/' --exclude 'session-config.json' \
            hackathon/output/ _site/hackathon/output/
          rm -rf _site/agentic-ai/venue

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
