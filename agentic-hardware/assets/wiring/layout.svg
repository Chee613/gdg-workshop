<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1200" viewBox="0 0 1600 1200">
<title>Gesture lamp physical wiring with real ESP32 and MOSFET driver photographs</title>
<desc>GPIO25 connects to In. The external five volt supply connects to V+. The power supply negative, ESP32 ground and driver ground share a three port connector. The LED strip connects to the driver positive and negative output terminals. USB powers the ESP32 separately.</desc>
<style>text{font-family:Arial,sans-serif;fill:#202124}.title{font-size:49px;font-weight:700;letter-spacing:-1.5px}.sub{font-size:21px;fill:#5f6368}.part{font-size:23px;font-weight:700}.small{font-size:19px;fill:#5f6368}.tag{font-size:20px;font-weight:700;paint-order:stroke;stroke:white;stroke-width:8px;stroke-linejoin:round}.wire{fill:none;stroke-linecap:round;stroke-linejoin:round}.halo{stroke:white;stroke-width:14px}.red{stroke:#ea4335;stroke-width:7px}.black{stroke:#25272b;stroke-width:7px}.blue{stroke:#4285f4;stroke-width:7px}.point{stroke:white;stroke-width:3px}.foot{font-size:17px;fill:#5f6368}</style>
<rect width="1600" height="1200" fill="#fff"/>
<path d="M55 38H420" stroke="#4285f4" stroke-width="5"/><path d="M420 38H490" stroke="#ea4335" stroke-width="5"/><path d="M490 38H560" stroke="#fbbc04" stroke-width="5"/><path d="M560 38H630" stroke="#34a853" stroke-width="5"/>
<text x="55" y="103" class="title">The actual wiring setup.</text>
<text x="55" y="143" class="sub">GDGoC UM × REC · Real component photos, with wires drawn onto the connection points</text>

<text x="105" y="280" class="part">ESP32-DevKitC V4</text>
<svg x="100" y="310" width="570" height="287" viewBox="395 185 835 420"><image xlink:href="PHOTO:esp-photo.png" width="1738" height="751"/></svg>
<text x="790" y="233" class="part">MOSFET driver</text>
<text x="790" y="260" class="small">Adafruit #5648 · 3.3V signal compatible</text>
<svg x="775" y="280" width="340" height="239" viewBox="160 140 640 450"><image xlink:href="PHOTO:mosfet.jpg" width="970" height="728"/></svg>
<text x="1170" y="195" class="part">5V white LED strip</text>
<text x="1170" y="222" class="small">Adafruit #5851 · 1m, 1.3A at 5V</text>
<svg x="1170" y="245" width="180" height="303" viewBox="390 300 220 370"><image xlink:href="PHOTO:led-leads.jpg" width="970" height="728"/></svg><image xlink:href="PHOTO:led.jpg" x="1370" y="300" width="165" height="124"/><text x="1370" y="452" class="small">Full strip</text><text x="1170" y="578" class="small">Wire ends enlarged</text>
<text x="1170" y="609" class="small">Use one red / black pair.</text>
<text x="1170" y="636" class="small">Insulate the unused pair separately.</text>
<text x="560" y="605" class="part">Shared ground</text>
<svg x="560" y="614" width="150" height="124" viewBox="380 250 230 190"><image xlink:href="PHOTO:ground-connector.jpg" width="970" height="728"/></svg>

<text x="100" y="822" class="part">5V / 2A power adapter</text>
<image xlink:href="PHOTO:power.jpg" x="100" y="842" width="380" height="285"/>
<text x="600" y="822" class="part">DC jack adapter</text>
<image xlink:href="PHOTO:adapter.jpg" x="600" y="842" width="200" height="150"/>

<!-- Wires use the actual photographed pin locations. Inputs are soldered pigtails. -->
<path d="M114 453 C68 453 55 460 55 515 V614" class="wire halo"/><path d="M114 453 C68 453 55 460 55 515 V614" class="wire black"/>
<text x="75" y="635" class="tag">Micro-USB data cable</text><text x="75" y="662" class="small">to laptop · powers the ESP32</text>
<path d="M387 324 V207 H745 V550 H962 V493" class="wire halo"/><path d="M387 324 V207 H745 V550 H962 V493" class="wire blue"/>
<path d="M594 581 H510 V775 H593 V722" class="wire halo"/><path d="M594 581 H510 V775 H593 V722" class="wire black"/>
