<path d="M733 878 H815 V793 H669 V722" class="wire halo"/><path d="M733 878 H815 V793 H669 V722" class="wire black"/>
<path d="M742 888 H944 V607 H928 V493" class="wire halo"/><path d="M742 888 H944 V607 H928 V493" class="wire red"/>
