<circle cx="894" cy="493" r="7" fill="#25272b" class="point"/><circle cx="928" cy="493" r="7" fill="#ea4335" class="point"/><circle cx="962" cy="493" r="7" fill="#4285f4" class="point"/>
<circle cx="1108" cy="378" r="7" fill="#25272b" class="point"/><circle cx="1108" cy="429" r="7" fill="#ea4335" class="point"/>
<text x="327" y="304" class="tag" style="fill:#1967d2">GPIO25</text><text x="400" y="193" class="tag" style="fill:#1967d2">Brightness control (PWM)</text>
<text x="613" y="565" class="tag">GND</text>
<text x="868" y="534" class="tag">GND</text><text x="911" y="579" class="tag" style="fill:#c5221f">V+</text><text x="979" y="534" class="tag" style="fill:#1967d2">In</text>
<text x="1081" y="366" class="tag">−</text><text x="1081" y="451" class="tag" style="fill:#c5221f">+</text>
<text x="1200" y="551" class="tag">−</text><text x="1330" y="518" class="tag" style="fill:#c5221f">+</text>
<text x="968" y="639" class="tag" style="fill:#c5221f">5V to V+</text>
<text x="706" y="875" class="tag">−</text><text x="756" y="925" class="tag" style="fill:#c5221f">+</text>


<rect x="990" y="683" width="545" height="336" rx="18" fill="#f8fafd" stroke="#e8eaed"/>
<text x="1020" y="729" class="part">Connect these five points</text>
<text x="1020" y="774" font-size="21" style="fill:#1967d2">1   GPIO25 → driver In</text>
<text x="1020" y="813" font-size="21">2   All three GND wires → ground connector</text>
<text x="1020" y="852" font-size="21" style="fill:#c5221f">3   Adapter +5V → driver V+</text>
<text x="1020" y="891" font-size="21" style="fill:#c5221f">4   Driver + output → LED red wire</text>
<text x="1020" y="930" font-size="21">5   Driver − output → LED black wire</text>
<text x="1020" y="979" class="small">USB connects the laptop to the ESP32.</text>

<text x="990" y="1060" font-size="20" font-weight="700">REC preparation: solder three driver input leads.</text>
<text x="990" y="1090" class="small">Use the GND, V+ and In pads; leave Out unused.</text>
<text x="990" y="1119" class="small">Use 22 AWG leads for the lamp power circuit.</text>
<text x="55" y="1164" class="foot">5V lamp circuit only · Leave ESP32 5V / 3V3 pins unconnected while using USB · Board sizes enlarged for clarity</text>
<text x="55" y="1190" class="foot">Component photography: Espressif and Adafruit · Proposed wiring layout, not a photo of a tested assembly</text>
</svg>
